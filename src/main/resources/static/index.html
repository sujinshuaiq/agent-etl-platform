<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DataForge · 多 Agent ETL 数据管道编排平台</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app">
    <!-- 侧边栏 -->
    <aside id="sidebar">
      <div class="logo" onclick="location.hash='#/dashboard'">
        <div class="logo-mark">DF</div>
        <div class="logo-text">
          <div class="logo-name">DataForge</div>
          <div class="logo-sub">多 Agent ETL 编排平台</div>
        </div>
      </div>
      <nav id="nav"></nav>
      <div class="sidebar-foot">v1.0 · 本地运行</div>
    </aside>

    <!-- 主区域 -->
    <div id="main">
      <header id="topbar">
        <div class="topbar-left">
          <h1 id="page-title">总览</h1>
        </div>
        <div class="topbar-right">
          <a class="alert-bell" href="#/alerts" title="未读告警">
            <span class="bell-icon">🔔</span>
            <span id="alert-badge" class="alert-badge hidden">0</span>
          </a>
          <div id="clock" class="clock">--:--:--</div>
        </div>
      </header>
      <main id="page-content"></main>
    </div>
  </div>

  <!-- 全局挂载点 -->
  <div id="modal-root"></div>
  <div id="toast-root"></div>

  <script src="vendor/echarts.min.js"></script>
  <script src="js/util.js"></script>
  <script src="js/api.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/router.js"></script>
  <script src="js/pages/dashboard.js"></script>
  <script src="js/pages/ai.js"></script>
  <script src="js/pages/agents.js"></script>
  <script src="js/pages/datasources.js"></script>
  <script src="js/pages/pipelines.js"></script>
  <script src="js/pages/pipeline-detail.js"></script>
  <script src="js/pages/runs.js"></script>
  <script src="js/pages/run-detail.js"></script>
  <script src="js/pages/quality.js"></script>
  <script src="js/pages/alerts.js"></script>
  <script src="js/pages/schedules.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
